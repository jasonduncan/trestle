# cargo-deny: known vulnerabilities, duplicate/banned crates, and where
# crates may come from, and which licenses dependencies may use.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # webpki-roots 0.26.11 is a semver-trick shim with no certificates of its
  # own: it depends on and re-exports webpki-roots 1.x, locked at 1.0.10,
  # which fixes this advisory. sqlx-core 0.8.6 still requires ^0.26 and no
  # 0.26 patch exists. Re-check on any sqlx upgrade, or if webpki-roots 1.x
  # in Cargo.lock drops below 1.0.10.
  { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 shim re-exports the patched 1.0.10" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true
