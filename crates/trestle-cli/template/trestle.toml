# The intent: what this server is. No secrets and nothing target-specific
# here; those come from the environment (see .env.example).

[project]
name = "{{name}}"
trestle = "{{trestle_version}}"

[auth]
passwords = true           # default; invite people with `trestle account invite`
# oidc = "google"          # opt-in; reads GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET

[tenancy]
model = "workspace"        # every model below is scoped to a workspace

[roles]
member = ["notes.read", "notes.write"]
viewer = ["notes.read"]

[[models]]
id = "notes.note"          # stable ID: never change it
# Field types: text, int, bool, uuid, enum (values = [...]), decimal
# (precision = 10, scale = 2; sent as a string like "12.50"), date
# ("2026-10-17"), instant (RFC 3339, stored and returned in UTC) and
# duration ("PT30M", "P1DT2H").
fields = [
  { id = "title",  type = "text", max = 200 },
  { id = "body",   type = "text", optional = true },
  { id = "pinned", type = "bool", default = false },
]

[[endpoints]]
model = "notes.note"
crud = ["list", "get", "create", "update", "delete"]
read = "notes.read"
write = "notes.write"
filter = ["pinned"]
order = "-created_at"
