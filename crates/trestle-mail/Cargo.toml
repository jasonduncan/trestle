[package]
name = "trestle-mail"
description = "Outgoing email for Trestle: a Mailer interface with SMTP and file backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["email","smtp"]
categories = ["email"]
include = ["src/**","Cargo.toml","README.md"]

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
url = "2"
uuid.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "macros"] }
url = "2"
