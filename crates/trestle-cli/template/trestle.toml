# The intent: what this server is. No secrets and nothing target-specific
# here; those come from the environment (see .env.example).

[project]
name = "{{name}}"
trestle = "{{trestle_version}}"

[auth]
passwords = true           # default; invite people with `trestle account invite`
# oidc = "google"          # opt-in; reads GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET

[tenancy]
model = "workspace"        # every model below is scoped to a workspace

[roles]
member = ["notes.read", "notes.write"]
viewer = ["notes.read"]

[[models]]
id = "notes.note"          # stable ID: never change it
# Field types: text, int, bool, uuid, enum (values = ["new", "won"], and
# optionally labels = { won = "Closed won" }: shown in forms and views, while
# the API and the column keep "won"; labels never need a migration), decimal
# (precision = 10, scale = 2; sent as a string like "12.50"), money (the same,
# plus currencies = ["USD"]; sent as {"amount", "currency"}), date
# ("2026-10-17"), instant (RFC 3339, stored and returned in UTC), duration
# ("PT30M", "P1DT2H") and ref (to = "<model id>": a row in the same tenant).
# writable = "actions" keeps a field out of create and update: only actions
# (below) write it, so it needs a default or optional = true.
fields = [
  { id = "title",  type = "text", max = 200 },
  { id = "body",   type = "text", optional = true },
  { id = "pinned", type = "bool", default = false },
]

[[endpoints]]
model = "notes.note"
crud = ["list", "get", "create", "update", "delete"]
read = "notes.read"
write = "notes.write"
filter = ["pinned"]
order = "-created_at"
# forms = true    # publish create/update forms the React renderer can draw

# A transition, declared instead of written in Rust (needs a bool field
# `archived`): POST /api/v1/notes/{id}/archive with If-Match.
# [[endpoints]]
# id = "notes.archive"
# path = "POST /api/v1/notes/{id}/archive"
# permission = "notes.write"
# set = { archived = true }
# when = { archived = [false] }

# Show notes in the admin shell to callers with a permission (add it to a
# role first). Buttons still run each operation's own permission.
# [[admin]]
# model = "notes.note"
# permission = "notes.admin"
# columns = ["title", "pinned"]   # default: every field
# actions = ["notes.archive"]
