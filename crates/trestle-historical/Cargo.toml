[package]
name = "trestle-historical"
description = "Trestle migration history: artifacts, ledger and runner. Never depends on current app code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["migrations","postgres","schema","database"]
categories = ["database","development-tools"]
include = ["src/**","Cargo.toml","README.md"]

[package.metadata.docs.rs]
all-features = true

[features]
# Disposable PostgreSQL databases for integration tests.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
trestle-protocol.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
trestle-historical = { path = ".", features = ["testing"] }
